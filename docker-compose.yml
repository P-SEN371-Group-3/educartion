services:
  postgres:
    image: postgres:16
    container_name: educartion-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: educartion_db
      POSTGRES_DB_TEST: educartion_db_test

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/init:/docker-entrypoint-initdb.d
      - ./:/sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educartion_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: educartion-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: educartion_db
      POSTGRES_SSLMODE: disable
      PORT: 8080

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/educartion
      dockerfile: Dockerfile

    container_name: educartion-frontend
    restart: unless-stopped

    environment:
      API_URL: http://api:8080

    ports:
      - "3000:3000"

volumes:
  postgres-data:




















